name: preview-sync

# Bản build nối Supabase GIẢ (tên miền không tồn tại) để test luồng đồng bộ bằng route mock.
# Chỉ dùng để kiểm thử, không chứa key thật. Đẩy sang nhánh `preview-sync`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-sync
  cancel-in-progress: true

jobs:
  preview-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock.supabase.test
          VITE_SUPABASE_ANON_KEY: sb_publishable_mock

      - name: Push dist to preview branch
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b preview-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "preview-sync build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview-sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
